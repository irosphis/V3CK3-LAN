name: build-windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build pinned sources
        shell: pwsh
        run: |
          $LogPath = Join-Path $env:RUNNER_TEMP 'build.log'
          $BuildFailed = $false
          try {
            & .\scripts\build.ps1 *>&1 | Tee-Object -FilePath $LogPath
          }
          catch {
            $_ | Out-String | Tee-Object -FilePath $LogPath -Append | Write-Host
            $BuildFailed = $true
          }

          if ($BuildFailed -or $LASTEXITCODE -ne 0) {
            $Message = (Get-Content $LogPath -Tail 80) -join "`n"
            $Message = $Message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Build log tail::$Message"
            exit 1
          }

      - name: Package clean runtime
        shell: pwsh
        run: .\scripts\package.ps1

      - name: Verify package
        shell: pwsh
        run: .\scripts\verify-package.ps1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: game-lan-windows-x64
          path: dist/game-lan
          if-no-files-found: error
